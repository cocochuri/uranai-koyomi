<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>占い暦</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#FF6FA1; --pink-deep:#E8558A; --pink-pale:#FFF3F7; --bg:#FFEAF1;
    --card:#FFFFFF; --purple:#8B7BD8; --purple-bg:#F1EEFC;
    --blue:#5FA9D8; --blue-bg:#EAF4FB; --green:#5FBE8B; --green-bg:#EBF9F1;
    --gold:#E0A94D; --gold-bg:#FBF3E4; --text:#4A3A42; --sub:#9C8790;
    --line:#FBE0EA; --shadow: 0 4px 18px rgba(255,111,161,0.14);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    background-color:#FFF6F9;
    background-image:
      repeating-linear-gradient(0deg, rgba(232,85,138,.16) 0 12px, transparent 12px 26px),
      repeating-linear-gradient(90deg, rgba(232,85,138,.16) 0 12px, transparent 12px 26px);
    background-blend-mode:multiply;
    color:var(--text); font-family:'M PLUS Rounded 1c','Hiragino Maru Gothic ProN','Yu Gothic',sans-serif;
    padding-bottom:92px;
  }
  #scrollArea{}
  .wrap{max-width:460px; margin:0 auto; padding:calc(env(safe-area-inset-top) + 20px) 14px 18px;}
  .ic-wrap{display:inline-flex; vertical-align:middle;}
  .ic-wrap svg{width:100%; height:100%; display:block;}

  /* ===== topbar ===== */
  .topbar{display:flex; align-items:flex-start; gap:12px; padding:6px 2px 14px;}
  .menu-btn{
    width:44px; height:44px; border-radius:50%; border:none; background:#fff; color:var(--pink-deep);
    box-shadow:var(--shadow); flex:0 0 auto; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .avatar{
    width:64px; height:64px; border-radius:50%; background:#fff; display:flex; align-items:center;
    justify-content:center; box-shadow:var(--shadow); flex:0 0 auto; border:3px solid #fff; overflow:hidden;
  }
  .avatar .ic-wrap{width:52px; height:52px;}
  .brand-titles{flex:1; text-align:center; position:relative; padding-top:6px;}
  .brand-titles h1{
    margin:0; font-size:27px; font-weight:800; color:var(--pink-deep); letter-spacing:1px;
    display:inline-flex; align-items:center; gap:2px;
  }
  .heart-swoosh{font-size:19px; color:var(--pink); transform:rotate(8deg); margin-left:2px;}
  .brand-titles p{margin:3px 0 0; font-size:11.5px; color:var(--sub);}
  .heart-deco{position:absolute; font-size:19px; color:var(--pink); opacity:.65; font-weight:400; text-shadow:0 1px 0 rgba(255,255,255,.4);}
  .hd1{top:-10px; left:0%; transform:rotate(-12deg);} .hd2{top:-6px; right:-2%; transform:rotate(10deg) scale(1.15);} .hd3{top:-6px; left:30%; font-size:13px; transform:rotate(-6deg);}

  /* ===== drawer ===== */
  .drawer-bg{display:none; position:fixed; inset:0; background:rgba(74,58,66,.4); z-index:60;}
  .drawer-bg.show{display:block;}
  .drawer{
    position:fixed; top:0; left:0; bottom:0; width:78%; max-width:320px; background:#fff; z-index:61;
    padding:22px 18px; transform:translateX(-105%); transition:transform .22s ease-out; overflow-y:auto;
  }
  .drawer-bg.show .drawer{transform:translateX(0);}
  .drawer h3{color:var(--pink-deep); font-size:17px; margin:4px 0 16px; display:flex; align-items:center; gap:6px;}
  .drawer h3 .ic-wrap{width:18px; height:18px; color:var(--pink-deep);}
  .drawer-person{
    display:flex; align-items:center; justify-content:space-between; padding:12px 14px; border-radius:14px;
    background:var(--pink-pale); margin-bottom:9px; cursor:pointer; border:2px solid transparent;
  }
  .drawer-person.active{border-color:var(--pink); background:#fff;}
  .drawer-person span.dn{font-weight:800; font-size:14.5px; display:flex; align-items:center; gap:6px;}
  .drawer-person span.dn .ic-wrap{width:14px; height:14px; color:var(--pink);}
  .drawer-person span.de{font-size:11px; color:var(--sub); cursor:pointer;}
  .drawer-add{
    display:flex; align-items:center; justify-content:center; gap:6px; padding:13px; border-radius:14px;
    border:2px dashed var(--pink); color:var(--pink-deep); font-weight:800; cursor:pointer; margin-top:8px;
  }

  .card{
    background:var(--card); border-radius:26px; padding:19px 18px 21px;
    box-shadow:var(--shadow); margin-bottom:14px; border:1.5px solid var(--line);
  }
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  @media (max-width:360px){ .grid2{grid-template-columns:1fr;} }
  .grid2 .card{margin-bottom:0;}

  .badge{
    display:inline-block; background:var(--pink); color:#fff; font-size:12px; font-weight:800;
    padding:6px 15px; border-radius:999px; margin-bottom:11px; box-shadow:0 2px 6px rgba(232,85,138,.25);
  }
  .today-date{font-size:30px; font-weight:800; color:var(--pink-deep); line-height:1.1;}
  .today-date span{font-size:17px; margin-left:5px; color:var(--sub); font-weight:700;}
  .today-line{font-size:14.5px; font-weight:700; margin-top:9px; line-height:1.6; display:flex; justify-content:space-between; align-items:flex-start; gap:6px;}
  .today-line .ic-wrap{width:16px; height:16px; color:var(--pink); flex:0 0 auto; margin-top:2px;}

  .mini-badges{display:flex; gap:5px; flex-wrap:wrap; margin:2px 0 10px;}
  .mini-badges .mb{
    background:var(--pink-pale); color:var(--pink-deep); font-size:10.8px; font-weight:700;
    padding:4px 9px; border-radius:999px; display:inline-flex; align-items:center; gap:4px;
  }
  .mini-badges .mb .ic-wrap{width:12px; height:12px;}
  .mini-badges .mb.daimyou{background:linear-gradient(135deg,var(--gold),var(--pink)); color:#fff;}
  .tap-link{border-bottom:1.5px dotted currentColor; cursor:pointer;}
  .keyword-box{background:var(--pink-pale); border-radius:18px; padding:16px; text-align:center; border:1px solid #FBD4E4;}
  .keyword-box .label{font-size:11.5px; color:var(--pink-deep); font-weight:800; margin-bottom:6px; display:flex; align-items:center; justify-content:center; gap:5px;}
  .keyword-box .label .ic-wrap{width:14px; height:14px; color:var(--green);}
  .keyword-box .kw{font-size:20px; font-weight:800; color:var(--pink-deep); letter-spacing:.5px;}
  .kw-heart{font-size:16px; color:var(--pink); margin-left:4px; display:inline-block; transform:rotate(-6deg);}
  .lp-heart{font-size:17px; color:var(--pink); opacity:.75;}

  h2.section-title{
    font-size:15px; font-weight:800; color:var(--pink-deep); margin:24px 4px 10px;
    display:flex; align-items:center; gap:7px;
  }
  h2.section-title .ic-wrap{width:16px; height:16px;}
  .num-badge{
    display:inline-flex; align-items:center; justify-content:center; width:22px; height:18px; border-radius:6px;
    background:var(--purple-bg); color:var(--purple); font-size:9px; font-weight:800;
  }
  .numero-grid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:7px; margin:12px 0 10px;}
  .numero-grid .box{background:var(--pink-pale); border-radius:14px; padding:9px 4px; text-align:center;}
  .numero-grid .box .n{font-size:19px; font-weight:800; color:var(--pink-deep);}
  .numero-grid .box .l{font-size:10px; color:var(--sub); font-weight:700; margin-top:2px;}
  .lifepath-row{display:flex; align-items:baseline; gap:9px; margin-bottom:4px;}
  .lifepath-row .num{font-size:32px; font-weight:800; color:var(--pink-deep);}
  .lifepath-row .lab{font-size:12px; color:var(--sub); font-weight:700;}
  .meaning{font-size:12.5px; line-height:1.6; margin-top:8px; background:var(--pink-pale); padding:11px 13px; border-radius:14px;}
  .meaning b{color:var(--pink-deep);}

  .color-row{display:flex; align-items:center; gap:13px;}
  .swatch{width:46px; height:46px; border-radius:50%; flex:0 0 auto; box-shadow:0 3px 8px rgba(0,0,0,.08);}
  .color-row .cname{font-size:16px; font-weight:800;}
  .color-row .cmean{font-size:12px; color:var(--sub); margin-top:2px; line-height:1.5;}

  .theme-grid{display:grid; grid-template-columns:1fr 1fr; gap:9px;}
  .theme-grid .tcard{border-radius:18px; padding:13px 12px; font-size:12px; line-height:1.55;}
  .theme-grid .tcard .th{font-size:12.5px; font-weight:800; margin-bottom:5px; display:flex; align-items:center; gap:5px;}
  .theme-grid .tcard .th .ic-wrap{width:15px; height:15px;}
  .tcard.work{background:var(--purple-bg);} .tcard.work .th{color:var(--purple);}
  .tcard.human{background:var(--blue-bg);} .tcard.human .th{color:var(--blue);}
  .tcard.health{background:var(--green-bg);} .tcard.health .th{color:var(--green);}
  .tcard.money{background:var(--gold-bg);} .tcard.money .th{color:var(--gold);}

  .onepoint{
    background:linear-gradient(135deg,var(--pink),var(--pink-deep)); color:#fff; border-radius:20px;
    padding:17px; text-align:center; margin:12px 0; position:relative; overflow:hidden;
  }
  .onepoint .tag{font-size:11.5px; opacity:.9; font-weight:700; margin-bottom:5px;}
  .onepoint .txt{font-size:15px; font-weight:800; line-height:1.6;}
  .onepoint .overall-txt{font-size:13px; font-weight:600; line-height:1.85; text-align:left;}
  .onepoint .heart-deco{color:#fff; opacity:.35; font-size:20px;}
  .onepoint .op1{top:8px; left:12px;} .onepoint .op2{bottom:6px; right:14px; font-size:15px;}

  .hero-advice{
    background:linear-gradient(160deg,var(--pink) 0%,var(--pink-deep) 100%); color:#fff; border-radius:22px;
    padding:20px 18px; margin-bottom:14px; position:relative; overflow:hidden; box-shadow:var(--shadow);
  }
  .hero-advice .heart-deco{color:#fff; opacity:.3; font-size:20px;}
  .hero-advice .op1{top:10px; left:12px;} .hero-advice .op2{bottom:10px; right:14px; font-size:16px;}
  .hero-date{font-size:11px; font-weight:700; opacity:.9; margin-bottom:6px;}
  .hero-headline{font-size:19px; font-weight:800; line-height:1.4; margin-bottom:12px;}
  .hero-bullets{list-style:none; margin:0 0 14px; padding:0; display:flex; flex-direction:column; gap:8px;}
  .hero-bullets li{
    display:flex; align-items:center; gap:8px; background:rgba(255,255,255,.16); border-radius:12px;
    padding:9px 12px; font-size:13.5px; font-weight:700;
  }
  .hero-bullets .ic-wrap{color:#fff; flex:0 0 auto;}
  .hero-sub{font-size:12.5px; font-weight:500; line-height:1.85; text-align:left; opacity:.96;}

  .general-today{
    background:var(--card); border-radius:24px; padding:19px 18px; margin-bottom:6px;
    box-shadow:var(--shadow); border:1.5px solid var(--line);
  }
  .gt-label{font-size:11px; font-weight:800; color:var(--gold); display:flex; align-items:center; gap:5px; margin-bottom:4px;}
  .gt-date{font-size:11.5px; color:var(--sub); font-weight:700; margin-bottom:6px;}
  .gt-headline{font-size:18px; font-weight:800; color:var(--pink-deep); line-height:1.4; margin-bottom:8px;}
  .gt-desc{font-size:12.5px; color:var(--text); line-height:1.7; margin-bottom:12px;}
  .gt-badges{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px;}
  .gt-bullets li{background:var(--pink-pale); color:var(--pink-deep);}
  .gt-bullets .ic-wrap{color:var(--green);}

  .divider-heart{display:flex; align-items:center; gap:8px; margin:20px 6px;}
  .divider-heart::before, .divider-heart::after{content:''; flex:1; height:0; border-top:2px dashed var(--pink); opacity:.45;}
  .divider-heart .ic-wrap{width:17px; height:17px; color:var(--pink); opacity:.85; flex:0 0 auto;}
  .scatter-heart{position:absolute; color:var(--pink); opacity:.4; pointer-events:none;}
  .card{position:relative;}
  .mascot-peek{
    position:absolute; border-radius:50%; background:#fff; border:3px solid #fff; box-shadow:var(--shadow);
    overflow:hidden; display:flex; align-items:center; justify-content:center; z-index:5;
    top:-18px; right:-12px;
  }

  textarea{
    width:100%; min-height:74px; border:2px solid var(--line); border-radius:14px; padding:12px;
    font-family:inherit; font-size:13.5px; resize:vertical; background:var(--pink-pale); color:var(--text);
  }
  textarea:focus{outline:none; border-color:var(--pink);}
  .save-note{font-size:10.5px; color:var(--sub); margin-top:6px; text-align:right;}

  .calendar-table{width:100%; border-collapse:collapse; margin-top:4px;}
  .calendar-table td{padding:9px 4px; font-size:12.5px; border-bottom:1px solid var(--line);}
  .calendar-table td.lab{color:var(--sub); font-weight:700; width:38%;}
  .calendar-table td.val{font-weight:700; display:flex; align-items:center; gap:5px;}
  .calendar-table td.val .ic-wrap{width:14px; height:14px; color:var(--pink);}
  .auto-note{background:var(--pink-pale); color:var(--pink-deep); font-size:11.5px; font-weight:700; text-align:center; padding:9px; border-radius:12px; margin-top:10px;}
  .disclaimer{font-size:10.5px; color:var(--sub); margin-top:9px; line-height:1.6;}

  .cal-row{display:flex; align-items:center; gap:12px; padding:11px 4px; border-bottom:1px solid var(--line); position:relative;}
  .cal-row:last-child{border-bottom:none;}
  .cal-row.today{background:var(--pink-pale); border-radius:14px; padding-left:8px; padding-right:8px;}
  .cal-date{flex:0 0 auto; width:52px; text-align:center;}
  .cal-date .cd-md{font-size:16px; font-weight:800; color:var(--pink-deep); line-height:1.1;}
  .cal-date .cd-wd{font-size:10px; color:var(--sub); font-weight:700;}
  .cal-body{flex:1; min-width:0;}
  .cal-kw{font-size:12.5px; font-weight:800; color:var(--pink-deep);}
  .cal-line{font-size:11.5px; color:var(--text); margin-top:1px;}
  .cal-today-tag{position:absolute; right:8px; top:8px; background:var(--pink); color:#fff; font-size:9px; font-weight:800; padding:3px 8px; border-radius:999px;}

  /* ===== modal ===== */
  .modal-bg{display:none; position:fixed; inset:0; background:rgba(74,58,66,.45); z-index:70; align-items:flex-end; justify-content:center;}
  .modal-bg.show{display:flex;}
  .modal{background:#fff; width:100%; max-width:460px; border-radius:22px 22px 0 0; padding:22px 20px 26px; animation:up .2s ease-out;}
  @keyframes up{from{transform:translateY(30px); opacity:0;} to{transform:translateY(0); opacity:1;}}
  .modal h3{margin:0 0 14px; color:var(--pink-deep); font-size:17px;}
  .modal label{font-size:12px; color:var(--sub); font-weight:700; display:block; margin:12px 0 5px;}
  .modal input{width:100%; padding:12px 14px; border:2px solid var(--line); border-radius:12px; font-size:15px; font-family:inherit; background:var(--pink-pale); color:var(--text);}
  .modal input:focus{outline:none; border-color:var(--pink);}
  .btn-row{display:flex; gap:10px; margin-top:18px;}
  .btn{flex:1; padding:14px; border:none; border-radius:14px; font-size:14.5px; font-weight:800; font-family:inherit; cursor:pointer;}
  .btn.primary{background:var(--pink); color:#fff;}
  .btn.ghost{background:var(--pink-pale); color:var(--pink-deep);}
  .btn.danger{background:#fff; color:#D9536B; border:2px solid #FBD3DE;}

  /* ===== bottom nav ===== */
  .bottom-nav{
    position:fixed; left:0; right:0; bottom:0; background:#fff; z-index:40;
    display:flex; padding:16px 4px calc(6px + env(safe-area-inset-bottom));
    box-shadow:0 -4px 14px rgba(255,111,161,.14);
    border-radius:22px 22px 0 0; border-top:2px solid var(--pink-pale);
  }
  .bottom-nav::before{
    content:''; position:absolute; left:0; right:0; top:-9px; height:18px;
    background-image: radial-gradient(circle at 9px 9px, #fff 8.5px, transparent 9px);
    background-size:18px 18px; background-repeat:repeat-x;
    filter: drop-shadow(0 -1px 0 var(--pink-pale));
  }
  .nav-btn{
    flex:1; background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:4px;
    font-family:inherit; color:var(--pink-deep); font-size:10px; font-weight:700; padding:4px 2px; cursor:pointer;
    position:relative;
  }
  .nav-btn .ic-wrap{width:22px; height:22px; position:relative;}
  .nav-btn.active .ic-wrap{filter:drop-shadow(0 2px 3px rgba(232,85,138,.35));}
  .nav-btn.active{color:var(--pink-deep);}
  .confetti{position:absolute; border-radius:50%; opacity:.85;}
  .confetti.star{border-radius:0; clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);}
  .nav-btn:nth-child(1) .c1{width:5px; height:5px; background:var(--purple); top:-6px; left:-9px;}
  .nav-btn:nth-child(1) .c2{width:7px; height:7px; background:var(--green); top:2px; right:-11px;}
  .nav-btn:nth-child(2) .c1{width:6px; height:6px; background:var(--pink); top:-7px; right:-8px;}
  .nav-btn:nth-child(2) .c2{width:5px; height:5px; background:var(--purple); bottom:0; left:-10px;}
  .nav-btn:nth-child(3) .c1{width:6px; height:6px; background:var(--purple); top:-6px; left:-9px;}
  .nav-btn:nth-child(3) .c2{width:5px; height:5px; background:var(--pink); bottom:1px; right:-10px;}
  .nav-btn:nth-child(4) .c1{width:7px; height:7px; background:var(--gold); top:-8px; left:-8px;}
  .nav-btn:nth-child(4) .c2{width:5px; height:5px; background:var(--pink); bottom:0; right:-10px;}

  .toast{
    position:fixed; left:50%; bottom:86px; transform:translateX(-50%) translateY(10px); background:var(--text);
    color:#fff; padding:10px 18px; border-radius:999px; font-size:12.5px; z-index:80; opacity:0;
    transition:.25s; pointer-events:none;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  .empty-state{text-align:center; padding:50px 20px;}
  .empty-state .em{width:70px; height:70px; margin:0 auto;}
  .empty-state h2{color:var(--pink-deep); font-size:18px; margin:10px 0 6px;}
  .empty-state p{color:var(--sub); font-size:13px; line-height:1.7;}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="navGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFA0C6"/>
      <stop offset="1" stop-color="#E8558A"/>
    </linearGradient>
  </defs>
</svg>

<div id="scrollArea">
<div class="wrap">
  <div class="topbar">
    <button class="menu-btn" id="menuBtn"></button>
    <div class="brand-titles">
      <span class="heart-deco hd1">♡</span>
      <span class="heart-deco hd3">♡</span>
      <h1 id="brandTitle">占い暦<span class="heart-swoosh">♡</span></h1>
      <span class="heart-deco hd2">♡</span>
      <p>今日のわたしを、ちょっと知る。</p>
    </div>
    <div class="avatar" id="avatarBox"></div>
  </div>

  <div id="content"></div>
</div>
</div>

<nav class="bottom-nav">
  <button class="nav-btn active" data-tab="home" data-icon="navHome">今日の暦</button>
  <button class="nav-btn" data-tab="calendar" data-icon="navCalendar">カレンダー</button>
  <button class="nav-btn" data-tab="dog" data-icon="navDog">わんこ</button>
  <button class="nav-btn" data-tab="settings" data-icon="navGear">設定</button>
</nav>

<div class="toast" id="toast"></div>
<input type="file" id="avatarInput" accept="image/*" style="display:none;">

<div class="drawer-bg" id="drawerBg">
  <div class="drawer" onclick="event.stopPropagation()">
    <h3><span class="ic-wrap" id="drawerTitleIcon"></span>占う人をえらぶ</h3>
    <div id="drawerList"></div>
    <div class="drawer-add" id="drawerAdd">＋ 新しく登録する</div>
  </div>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3 id="modalTitle">占う人を追加</h3>
    <label>お名前・呼び方</label>
    <input id="inName" placeholder="例：わたし／娘／ゆうちゃん">
    <label>生年月日</label>
    <input id="inBirth" type="date">
    <div class="btn-row">
      <button class="btn ghost" id="btnCancel">キャンセル</button>
      <button class="btn primary" id="btnSave">保存する</button>
    </div>
    <div class="btn-row" id="deleteRow" style="display:none;">
      <button class="btn danger" id="btnDelete">この人を削除する</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="infoModalBg">
  <div class="modal">
    <h3 id="infoModalTitle"></h3>
    <div id="infoModalBody" style="font-size:13px; line-height:1.85; color:var(--text);"></div>
    <div class="btn-row"><button class="btn primary" id="infoModalClose">閉じる</button></div>
  </div>

/* ===== 乱数(日付+名前で固定される占い結果) ===== */
function hashStr(str){
  let h = 1779033703 ^ str.length;
  for(let i=0;i<str.length;i++){
    h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
  }
  return function(){
    h = Math.imul(h ^ (h >>> 16), 2246822507);
    h = Math.imul(h ^ (h >>> 13), 3266489909);
    h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  };
}
function seededPick(rng, arr){ return arr[Math.floor(rng()*arr.length)]; }

/* ===== 数秘術 ===== */
function digitSum(str){ return str.split('').filter(c=>/[0-9]/.test(c)).reduce((a,c)=>a+Number(c),0); }
function reduceFull(n){ while(n>9){ n = digitSum(String(n)); } return n; }
function reduceKeepMaster(n){ while(n>9 && ![11,22,33].includes(n)){ n = digitSum(String(n)); } return n; }
function calcNumerology(birth, todayDate){
  const [y,m,d] = birth.split('-').map(Number);
  const lifePath = reduceKeepMaster(digitSum(String(y)+String(m)+String(d)));
  const ty = todayDate.getFullYear(), tm = todayDate.getMonth()+1, td = todayDate.getDate();
  const personalYear = reduceFull(digitSum(String(m))+digitSum(String(d))+digitSum(String(ty)));
  const personalMonth = reduceFull(personalYear + tm);
  const personalDay = reduceFull(personalMonth + td);
  return {lifePath, personalYear, personalMonth, personalDay};
}

function calcKin(input){
  let d;
  if(typeof input === 'string'){
    const [y,m,dd] = input.split('-').map(Number);
    d = Date.UTC(y, m-1, dd);
  } else {
    d = Date.UTC(input.getFullYear(), input.getMonth(), input.getDate());
  }
  const ref = Date.UTC(1987,7,16); // 1987/8/16 = KIN1 とする一般的な簡易計算
  const diffDays = Math.round((d-ref)/86400000);
  return ((diffDays % 260)+260)%260 + 1;
}

function calcNineStar(birthStr){
  const [y,m,d] = birthStr.split('-').map(Number);
  let year = y;
  if(m < 2 || (m===2 && d<4)) year -= 1; // 立春(2/4簡易)より前は前年扱い
  let dr = digitSum(String(year));
  while(dr>9){ dr = digitSum(String(dr)); }
  let star = 11 - dr;
  if(star > 9) star -= 9;
  return star; // 1-9
}

function moonPhase(date){
  const synodic = 29.53058867;
  const ref = Date.UTC(2000,0,6,18,14)/86400000;
  let age = (dayCount(date) - ref) % synodic;
  if(age<0) age += synodic;
  if(age<1.85) return 'new';
  if(age<5.55) return 'young';
  if(age<9.25) return 'firstq';
  if(age<12.95) return 'waxg';
  if(age<16.65) return 'full';
  if(age<20.35) return 'waning';
  if(age<24.05) return 'lastq';
  return 'old';
}

function fmtDateKey(d){ return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }

function renderCalendarView(person){
  const content = document.getElementById('content');
  let rows = '';
  for(let i=0;i<14;i++){
    const d = new Date(dateObj.getFullYear(), dateObj.getMonth(), dateObj.getDate()+i);
    const dk = fmtDateKey(d);
    const seedStr = person.name + '_' + person.birth + '_' + dk;
    const rng = hashStr(seedStr);
    const t = seededPick(rng, THEMES);
    const isToday = i===0;
    rows += `
      <div class="cal-row${isToday ? ' today':''}">
        <div class="cal-date">
          <div class="cd-md">${d.getMonth()+1}/${d.getDate()}</div>
          <div class="cd-wd">(${WEEK[d.getDay()]})</div>
        </div>
        <div class="cal-body">
          <div class="cal-kw">${t.kw}</div>
          <div class="cal-line">${t.line}</div>
        </div>
        ${isToday ? '<span class="cal-today-tag">Today</span>' : ''}
      </div>`;
  }
  content.innerHTML = `
    <h2 class="section-title">${ic('calendar','color:var(--pink-deep);')}${person.name}さんの2週間占い</h2>
    <div class="card" style="padding:8px 12px;">
      ${rows}
    </div>
    <div class="disclaimer" style="margin:2px 8px 0;">※先の日付ほど簡易的な内容です。当日になると、より詳しいページ(今日の暦)が見られます。</div>
  `;
}

function renderAvatar(personId){
  const box = document.getElementById('avatarBox');
  const img = personId ? localStorage.getItem('uranai_avatar_'+personId) : null;
  if(img){
    box.innerHTML = '<img src="'+img+'" style="width:100%;height:100%;object-fit:cover;">';
  } else {
    box.innerHTML = ic('dog','width:52px;height:52px;');
  }
}

function avatarSmallHTML(personId, size){
  const img = personId ? localStorage.getItem('uranai_avatar_'+personId) : null;
  const inner = img
    ? '<img src="'+img+'" style="width:100%;height:100%;object-fit:cover;">'
    : ic('dog','width:'+Math.round(size*0.78)+'px;height:'+Math.round(size*0.78)+'px;');
  return '<div class="mascot-peek" style="width:'+size+'px;height:'+size+'px;">'+inner+'</div>';
}

function handleAvatarFile(file, personId){
  const reader = new FileReader();
  reader.onload = (e)=>{
    const img = new Image();
    img.onload = ()=>{
      const size = 240;
      const canvas = document.createElement('canvas');
      canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext('2d');
      const side = Math.min(img.width, img.height);
      const sx = (img.width - side)/2, sy = (img.height - side)/2;
      ctx.drawImage(img, sx, sy, side, side, 0, 0, size, size);
      try{
        const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
        localStorage.setItem('uranai_avatar_'+personId, dataUrl);
        renderAvatar(personId);
        showToast('わんこの写真を登録しました');
      }catch(err){
        showToast('画像の保存に失敗しました');
      }
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

/* ===== モーダル(人の追加・編集) ===== */
let editingId = null;
function openModal(person){
  editingId = person ? person.id : null;
  document.getElementById('modalTitle').textContent = person ? ('「'+person.name+'」を編集') : '占う人を追加';
  document.getElementById('inName').value = person ? person.name : '';
  document.getElementById('inBirth').value = person ? person.birth : '';
  document.getElementById('deleteRow').style.display = person ? 'flex' : 'none';
  document.getElementById('modalBg').classList.add('show');
}
function closeModal(){ document.getElementById('modalBg').classList.remove('show'); }
document.getElementById('btnCancel').onclick = closeModal;
function openInfoModal(title, bodyHtml){
  document.getElementById('infoModalTitle').textContent = title;
  document.getElementById('infoModalBody').innerHTML = bodyHtml;
  document.getElementById('infoModalBg').classList.add('show');
}
function closeInfoModal(){ document.getElementById('infoModalBg').classList.remove('show'); }
document.getElementById('infoModalClose').onclick = closeInfoModal;
document.getElementById('infoModalBg').onclick = (e)=>{ if(e.target.id==='infoModalBg') closeInfoModal(); };
function showKanshiInfo(kIdx){ const info = kanshiExplain(kIdx); openInfoModal(info.title, info.body); }
function showDaimyouInfo(){ const info = daimyouExplain(); openInfoModal(info.title, info.body); }
document.getElementById('modalBg').onclick = (e)=>{ if(e.target.id==='modalBg') closeModal(); };
document.getElementById('btnSave').onclick = ()=>{
  const name = document.getElementById('inName').value.trim();
  const birth = document.getElementById('inBirth').value;
  if(!name || !birth){ alert('お名前と生年月日を入力してください'); return; }
  let people = loadPeople();
  if(editingId){
    people = people.map(p=> p.id===editingId ? {...p, name, birth} : p);
  } else {
    const id = 'p_' + Date.now();
    people.push({id, name, birth});
    setCurrentId(id);
  }
  savePeople(people);
  closeModal();
  render();
};
document.getElementById('btnDelete').onclick = ()=>{
  if(!confirm('この人を削除します。よろしいですか？')) return;
  let people = loadPeople().filter(p=>p.id!==editingId);
  savePeople(people);
  if(getCurrentId()===editingId && people.length){ setCurrentId(people[0].id); }
  closeModal();
  render();
};

render();
</script>
